spring.application.name=demo
spring.main.banner-mode=off

# logging.level.org.springframework.security=DEBUG
logging.level.root=WARN


# logging the SQL statements being generated by Hibernate
logging.level.org.hibernate.SQL=TRACE

# logging the binding parameters to see the actual values being used in the SQL statements
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.datasource.url=jdbc:mysql://localhost:3306/hb-01-one-to-one-uni
spring.datasource.username=root
spring.datasource.password=bedo

springdoc.swagger-ui.path=/index.html
spring.data.rest.base-path=/api
